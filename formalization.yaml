# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Moh's P3 curve is a set-theoretic complete intersection"
  description: >-
    A Lean 4 formalization proving that the Moh curve parametrized by
    x=t^6+t^31, y=t^8, z=t^10 is cut out set-theoretically by two explicit
    equations over every characteristic-zero field. The development computes
    the polynomial and formal-power-series parametrization kernels, proves the
    radical equality for the two-generated witness ideal, and proves that the
    curve ideal has height two and arithmetic rank two, both globally and
    after completion.
  authors:
    - "Aakash Gurung"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Aakash Gurung"

classification:
  arxiv: [math.AC, math.AG]
  msc2020: [13C40, 14M10, 13H05, 13P10]

sources:
  - title: "Moh's P3 Curve Is a Global Set-Theoretic Complete Intersection"
    authors:
      - "Aakash Gurung"
    type: paper
    location: "Papers/v1/Moh_P3_global.tex"
    relationship: formalizes
    note: >-
      The Lean development formalizes the manuscript's global and formal-local
      set-theoretic complete-intersection conclusions. Its formal-local kernel
      proof uses an explicit weighted division argument rather than the
      manuscript's normalization-and-completion proof.
    license: "Apache-2.0"
    author_endorsement: participated
  - title: "Prime ideals of Moh and the characteristic of the field"
    authors:
      - "Luis González"
      - "Francesc Planas-Vilanova"
    id: "arXiv:2407.21692"
    type: article
    location: "https://arxiv.org/abs/2407.21692"
    relationship: background
    note: >-
      Source for the characteristic-zero generators of the Moh P3 prime used
      by the manuscript and formalization.
    author_endorsement: n/a
  - title: "Symbolic powers, set-theoretic complete intersection and certain invariants"
    authors:
      - "Clare D'Cruz"
    id: "arXiv:2003.09101"
    type: article
    location: "https://arxiv.org/abs/2003.09101"
    relationship: background
    note: >-
      Records the formal-local set-theoretic complete-intersection question
      answered for this Moh prime.
    author_endorsement: n/a
  - title: "On the unboundedness of generators of prime ideals in power series rings of three variables"
    authors:
      - "T. T. Moh"
    type: article
    location: "Journal of the Mathematical Society of Japan 26 (1974), 722-734"
    relationship: background
    note: "Introduces the family of Moh primes containing the present P3 example."
    author_endorsement: n/a

related_formalizations: []

status:
  scope: >-
    The two compared declarations state the global polynomial theorem and the
    formal-power-series theorem over an arbitrary characteristic-zero field.
    Each includes the exact parametrization kernel, the radical equality for
    the two explicit equations, height two, and arithmetic rank two. All are
    unconditional under Field and CharZero. The proof development also checks
    the explicit square-containment certificate. It does not formalize the
    manuscript's Hilbert-Burch matrix symmetrization as matrix algebra, and the
    accompanying Macaulay2 computations are not part of the Lean trust chain.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: "MohP3.Palomar.global_setTheoretic_completeIntersection"
      module: "Solution"
      summary: >-
        The global Moh P3 prime is the radical of the two-generated witness
        ideal and has height and arithmetic rank two.
    - declaration: "MohP3.Palomar.formalLocal_setTheoretic_completeIntersection"
      module: "Solution"
      summary: >-
        The same kernel, radical, height, and arithmetic-rank statements hold
        in the formal power series ring.

